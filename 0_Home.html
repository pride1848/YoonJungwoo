    <style>
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .hero-section {

        .hero-name-sub {

            font-style: italic;

        }
        .hero-desc { 
            font-family: 'Inter', sans-serif; 
            font-weight: 300; 
            letter-spacing: 0.2em; 
            text-transform: none;

        .centered-logo {
